# hypothesis 节点的 fixture —— 预注入一个上游 survey_report，让 hypothesis
# 有"研究背景"做基础，输出 1-3 个带 falsification_criteria 的可证伪假设。
#
# 运行：
#   python run_node.py --harness hypothesis --sandbox --fixture nodes/hypothesis/fixtures/minimal.yaml
#
# 预期产出：
#   - pre_registration 类型 artifact（每个假设一份），含 falsification_criteria_structured
#   - 可能 create_claim(claim_type='hypothesis') 调用入 KB（带 prereg_chunk_id）

node_inputs:
  research_question: |
    在分子动力学（MD）模拟里，Lennard-Jones 流体的温度稳态收敛速度受 thermostat 选择影响多大？
    我们想验证：Nosé-Hoover chain (NHC) 比 single Nosé-Hoover 在高密度 LJ 上更快达稳态。
  scope_hint: |
    重点关注：温度收敛时间、稳态后的温度波动 std；不要扩到能量守恒 / 压力等其它指标。

upstream_artifacts:
  - type: survey_report
    name: LJ_MD_Thermostat_Survey
    content: |
      ## Lennard-Jones MD Thermostat Best Practices Survey

      ### 关键 finding

      1. **Nosé-Hoover chain（NHC）**比 single Nosé-Hoover ergodic 更好，
         尤其在 high-density LJ (ρ > 0.8)（Tobias et al. 2000, Martyna et al. 1992）。
      2. **Single Nosé-Hoover** 在 stiff systems 已知会卡在 non-ergodic 区域。
      3. **Bussi-Donadio-Parrinello (BDP)** stochastic thermostat 是 ergodic 但
         可能 dampen 真实动力学（Bussi 2007）。
      4. 文献中关于"收敛速度"的定量对比稀少 —— 大多数 paper 比的是
         稳态后的统计性质，没人系统对比"收敛 to steady state 多快"。

      ### Open questions

      Q1: 在 ρ=0.85, T*=1.5 的 LJ 流体上，NHC chain length=3 比 single NH
          温度收敛快多少 wall time？
      Q2: 是否存在阈值密度 ρ_critical，低于它 single NH 也够用？

memory_entries:
  - kind: directive
    text: "每个 hypothesis 必须配机械可判 falsification_criteria_structured（metric+comparison+…）。数值比较须 threshold+threshold_rationale；定性/存在性用 comparison=qualitative|exists|not_exists 并写清判据。"
    tags: [hypothesis, falsifiability]
  - kind: observation
    text: "上游 survey 提到 NHC 在高密度 LJ 更 ergodic，但缺定量收敛速度对比 —— 这是我们要测的 gap。"
    tags: [open_question, thermostat]
