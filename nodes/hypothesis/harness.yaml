context_config:
  memory_query: "hypothesis design, pre-registration"
  kb_query: ""
  max_output_tokens: 16384
  temperature: 0.4

# v0.4：交付契约按 mode 分流。
# `plan` 出全套；`revise` 只欠一版新的 research_state —— 拿实验结果回来改计划，
# 本来就不该被要求"再交一份 pre_registration + HIF 报告 + overview"。
# 真改了计划/命题，产物自然会多出来；契约不强求，判据（validate）按"本轮有没有
# 新增科学承诺"自适应。
#
# ⚠️ Project v2（Workspace-First）下 executor 的 `missing` 恒为 []，这份契约当前
# 主要作用在 handoff 上；写全是为了两个底座
# 说的是同一件事（同一个问题只能有一个真相源）。
required_output_artifact_types_by_mode:
  plan:
    - research_state
    - pre_registration
    - research_plan
    - hypothesis_innovation_report
    - hypothesis_research_overview
  revise:
    - research_state
required_output_artifact_types:
  - research_state
  - pre_registration
  - research_plan
  - hypothesis_innovation_report
  - hypothesis_research_overview

completion_criteria:

expected_inputs:
  mode: |
    这一趟要跑多重（v0.4）。**通常不用传** —— 节点开局会按项目状态机械判定
    （盘上有没有冻结的 pre_registration + research_state），判定结果写进
    transcript 的 `analysis_mode_resolved` 事件，可审计。
      - `plan`   ：出计划。显式传它可以**强制**重出计划（pivot / 推倒重来），
                   即使项目已有生效协议。
      - `revise` ：拿实验结果回来改计划。**不能靠申报获得** —— 项目没有
                   冻结 prereg + research_state 时会被降级回 plan 并说明原因
                   （否则它就成了跳过整套预注册的绕行路径）。
  research_goal:
    title: "研究标题"
    goals: "要回答的核心问题列表"
    preferences: "优先方法/对比对象"
    constraints: "不做/不扩展的边界"
    desirable_attributes: "期望假设特质（sharp falsifier 等）"
    must_cover: "多支柱主题列表（可选；也可从 user_prompt「包含A、B、C」解析）"
    locked_taxonomy: "用户分类/操作类别锁定表 [{label, definition}]（可选）"
  research_question: "legacy：自然语言研究方向（自动映射到 goals）"
  must_cover: "显式多支柱列表，防止复杂任务退化"
  locked_taxonomy: "显式分类定义锁定，防止 prereg 改写用户 ontology"
  operation_categories: "同 locked_taxonomy 的别名输入"
  survey_artifact_id: "上游 literature 产的 survey_report（可选）"
  reference_papers: "参考论文列表（doi + 可选 pdf_fixture）"
  primary_paper_doi: "主参考论文 DOI"
  hypothesis_iteration:
    max_refine_rounds: "Evolution 最大轮数，默认 2"
    min_candidates: "可选：发散最少候选数。**不传就没有下限** —— 框架不替你定。"
    target_prereg: "可选：调用方明确要几个研究问题时才传。**不传就由课题决定**，框架不给目标数（实测：给了默认 3，节点就正好交 3 个）。"
    stop_hif_min: "收敛最低 HIF，默认 45"

expected_outputs:
  research_state: "版本化研究状态：每个研究问题（Qx / legacy Hx）的状态与证据链、计划版本链、已完成实验与可信度、缺口、verdict（continue/pivot/ready_candidate/abort）"
  pre_registration: "markdown：`## Research Questions` —— 每个问题的 output_kind、【有命题时】proposition、冻结的闭合条件清单（数值条/陈述条）；带命题的问题另附 assumption_tree 与预测（frozen）"
  research_plan: "markdown：experimental_design + computational_workflow + baselines + resource_estimates + risk_analysis 五件套"
  hypothesis_innovation_report: "markdown+JSON：HIF 评分卡（G/D/M/P/R/Q/I + tier）"
  hypothesis_research_overview: "markdown：top 假设摘要 + 淘汰候选原因 + 未探索方向"

handoff_policy:
  strategy: full
  max_tokens: 3000
  required_fields:
    - hypothesis_ids
    - prereg_artifact_id
    - research_plan_artifact_id
    - research_state_artifact_id
    - verdict

max_turns: 0

# v2.0（2026-08-07 架构改造）：本节点可按需调文献调研服务。
# 依据：并非每个项目都该先完整跑一遍 literature；缺文献证据、遇到定向问题
# （方法/benchmark 不清楚、结果与预期冲突、需核对阈值或已有结论）时按需调用
# 更自然。已有 survey_report 足够时直接用，别重复调研；同一查询别反复调。
callable_nodes:
  - literature
