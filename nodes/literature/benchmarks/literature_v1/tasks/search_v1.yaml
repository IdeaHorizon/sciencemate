suite: literaturebench_v1_search
version: 0.2.0
sampling_frame: |
  以中国学位学科目录的一级学科为依据，但为避免 89 个一级学科带来样本碎片化，
  合并为 12 个公开、可解释的宏观领域。每个领域固定五种题型：精确题名、短关键词、
  自然语言问题、方法—对象问题、歧义/边界问题。流体、海洋、微塑料、防波堤等
  曾用于本项目调试的题目不进入公开集，只保留在内部回归集。
instructions_to_system: |
  请直接完成用户问题。返回不超过 50 篇论文；每篇尽可能提供标题、作者、年份、
  期刊/预印本、DOI 或可访问 URL、摘要来源状态。若没有足够相关论文，明确说明，
  不得用主题相邻论文凑数。

# 一级学科依据：仓库 discipline_catalog.source.json 所记录的传统一级/二级学科目录。
# 这里的宏观层只用于平衡抽样、分层报告，绝不要求系统采用同一分类体系。
strata:
  - {id: mathematical_sciences, label: 数学与统计, china_first_level: [数学, 统计学, 系统科学]}
  - {id: physical_astronomical, label: 物理与天文, china_first_level: [物理学, 天文学]}
  - {id: chemistry_materials, label: 化学与材料, china_first_level: [化学, 材料科学与工程, 冶金工程]}
  - {id: earth_environment, label: 地球、环境与海洋系统, china_first_level: [地理学, 大气科学, 海洋科学, 地球物理学, 地质学, 环境科学与工程]}
  - {id: life_medicine, label: 生命科学与医学, china_first_level: [生物学, 基础医学, 临床医学, 公共卫生与预防医学, 药学]}
  - {id: engineering_energy, label: 工程、建造与能源, china_first_level: [力学, 机械工程, 土木工程, 水利工程, 动力工程及工程热物理, 交通运输工程, 船舶与海洋工程]}
  - {id: information_ai, label: 信息科学与人工智能, china_first_level: [计算机科学与技术, 控制科学与工程, 软件工程, 网络空间安全, 电子科学与技术]}
  - {id: agriculture_food, label: 农业、食品与生态生产, china_first_level: [作物学, 园艺学, 农业资源与环境, 植物保护, 畜牧学, 水产, 食品科学与工程]}
  - {id: economics_management, label: 经济、管理与会计, china_first_level: [理论经济学, 应用经济学, 工商管理, 管理科学与工程, 农林经济管理]}
  - {id: society_education, label: 社会科学、教育与心理, china_first_level: [社会学, 教育学, 心理学, 新闻传播学, 体育学]}
  - {id: law_governance, label: 法学、政治与公共治理, china_first_level: [法学, 政治学, 民族学, 公共管理]}
  - {id: humanities_arts, label: 人文、历史、语言与艺术, china_first_level: [哲学, 历史学, 中国语言文学, 外国语言文学, 艺术学]}

