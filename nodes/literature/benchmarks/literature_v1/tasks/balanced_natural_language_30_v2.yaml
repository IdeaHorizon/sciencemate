suite: literaturebench_balanced_natural_language_30_v2
version: 0.2.0
status: draft_unscored
language: zh-CN
result_limit: 100
design: >-
  用于 ScienceMate 面向用户的学术检索模块、独立于旧 ESI 题库的 30 道自然语言检索题。
  按六大研究领域分层；每题固定请求并保存最多 100 篇，前 20 篇逐篇深评，其余页面抽检与全量审计。
  题目和评分只要求能从题名、摘要、书目元数据及原文页面确认的信息，不要求读取全文。
prompt_rule: >-
  学术搜索框直接输入 prompt_zh 原文。对话模型可统一追加下面的输出要求；
  不得为某个平台手工扩充关键词、指定论文或增加追问。
chat_output_contract_zh: >-
  请按相关性排序，最多列出 20 篇真实可核验的学术文献；不足 20 篇不要凑数。
  每篇列出标题、作者、年份、期刊或其他出处、DOI 或稳定原文链接，
  并用一句话说明与问题的关系。无法核实的字段留空，不要推测全文结论。
evaluation_scope: >-
  按 scoring_standard_30_v2.md 分别评估前排相关性、论文证据质量、问题要点覆盖、
  引文真实性、有效研究数量、书目准确与完整、时间适切性；七项分别按百分制报告，
  不合成总分。运行失败、耗时和成本单列。
  题名、摘要及可得页面无法判断的方法细节记为未知，不要求被测系统提供全文。
field_quotas:
  natural_sciences: 6
  engineering_and_technology: 5
  medical_and_health_sciences: 5
  agricultural_and_veterinary_sciences: 4
  social_sciences: 5
  humanities_and_arts: 5
tasks:
  - id: NL01
    broad_field: natural_sciences
    focus: astronomy
    prompt_zh: >-
      我想了解利用引力波“标准警报器”测量哈勃常数的研究。请找代表性的方法论文和观测论文，并简要说明它们各自研究什么。
  - id: NL02
    broad_field: natural_sciences
    focus: environmental_science
    prompt_zh: >-
      城市绿地能否缓解城市热岛？请找用遥感或地面观测研究绿地降温的论文，优先列出比较不同绿地规模或不同城市的研究。
  - id: NL03
    broad_field: natural_sciences
    focus: chemistry
    prompt_zh: >-
      铜基催化剂怎样提高电催化二氧化碳还原生成乙烯的选择性？请找讨论催化剂结构和反应条件的实验论文或综述。
  - id: NL04
    broad_field: engineering_and_technology
    focus: energy_engineering
    prompt_zh: >-
      锂离子电池热失控有哪些可用于提前预警的信号和方法？请找研究温度、电压、气体传感或数据驱动预警的论文。
  - id: NL05
    broad_field: engineering_and_technology
    focus: civil_engineering
    prompt_zh: >-
      数字孪生怎样用于桥梁损伤监测和维护？请找直接以桥梁为对象的研究，区分概念综述和具体应用。
  - id: NL06
    broad_field: engineering_and_technology
    focus: environmental_engineering
    prompt_zh: >-
      海水淡化的反渗透膜污染可以怎样预测或减轻？请找关于污染机理、运行优化或清洗方法的研究和综述。
  - id: NL07
    broad_field: medical_and_health_sciences
    focus: clinical_informatics
    prompt_zh: >-
      机器学习能否较早预测脓毒症？请找模型开发、外部验证和综述论文，关注研究是否使用临床真实患者数据。
  - id: NL08
    broad_field: medical_and_health_sciences
    focus: neurology
    prompt_zh: >-
      长期新冠与认知障碍之间有什么研究证据？请找随访研究或系统综述，关注记忆、注意力等认知表现。
  - id: NL09
    broad_field: medical_and_health_sciences
    focus: cardiology
    prompt_zh: >-
      SGLT2 抑制剂对射血分数保留型心力衰竭患者是否有获益？请找关键随机试验和系统综述，说明它们关注的主要临床结局。
  - id: NL10
    broad_field: agricultural_and_veterinary_sciences
    focus: crop_science
    prompt_zh: >-
      干旱条件下小麦根系性状与产量有什么关系？请找田间实验或综述，关注根系深度、根量与水分利用效率。
  - id: NL11
    broad_field: agricultural_and_veterinary_sciences
    focus: precision_agriculture
    prompt_zh: >-
      土壤水分传感器指导的精准灌溉能否节水而不明显减产？请找田间试验和综述，尽量涉及不同作物。
  - id: NL12
    broad_field: agricultural_and_veterinary_sciences
    focus: aquaculture
    prompt_zh: >-
      水产养殖使用抗生素与环境中耐药基因的出现有什么关系？请找养殖场监测或治理研究，并区分综述与实际采样研究。
  - id: NL13
    broad_field: social_sciences
    focus: economics
    prompt_zh: >-
      现金补助对低收入家庭儿童的教育有什么影响？请找实证研究和综述，关注入学、成绩或完成学业。
  - id: NL14
    broad_field: social_sciences
    focus: labor_studies
    prompt_zh: >-
      外卖或网约车平台的算法管理如何影响劳动者？请找讨论派单、收入或工作自主性的实证研究。
  - id: NL15
    broad_field: social_sciences
    focus: communication_studies
    prompt_zh: >-
      社交媒体事实核查能否减少人们相信或传播错误信息？请找实验研究和系统综述，优先关注实际传播行为。
  - id: NL16
    broad_field: humanities_and_arts
    focus: archaeology_and_history
    prompt_zh: >-
      古 DNA 研究如何帮助解释欧洲青铜时代的人口迁移？请找结合遗传学和考古学的代表性研究或综述。
  - id: NL17
    broad_field: humanities_and_arts
    focus: literary_studies
    prompt_zh: >-
      《藻海无边》与《简·爱》的关系在殖民主题的文学研究中如何讨论？请找直接比较两部作品的学术论文，排除书评和小说原著。
  - id: NL18
    broad_field: humanities_and_arts
    focus: museum_studies_and_ethics
    prompt_zh: >-
      殖民时期流散的博物馆藏品应否归还原属地？请找讨论具体返还案例或相关伦理、法律问题的学术论文，排除新闻报道。
  - id: NL19
    broad_field: natural_sciences
    focus: mathematics
    prompt_zh: >-
      熵正则化为什么能让最优传输计算更快？请找介绍 Sinkhorn 算法及其近似精度的理论或综述论文。
  - id: NL20
    broad_field: natural_sciences
    focus: computer_and_information_sciences
    prompt_zh: >-
      在检索增强生成中，重排序检索结果能否减少回答错误和错误引文？请找相关实验研究或综述，并说明它们研究了哪类任务。
  - id: NL21
    broad_field: natural_sciences
    focus: biological_sciences
    prompt_zh: >-
      珊瑚白化后改变共生藻组成，是否可能提高耐热性？请找野外研究、实验研究或综述，关注不同珊瑚物种。
  - id: NL22
    broad_field: engineering_and_technology
    focus: electrical_engineering
    prompt_zh: >-
      碳化硅功率 MOSFET 的栅氧化层退化有哪些主要原因？请找器件可靠性的实验论文和综述。
  - id: NL23
    broad_field: engineering_and_technology
    focus: materials_engineering
    prompt_zh: >-
      金属增材制造件的孔隙缺陷会怎样影响疲劳性能？请找疲劳实验和无损检测研究。
  - id: NL24
    broad_field: medical_and_health_sciences
    focus: public_health
    prompt_zh: >-
      长期 PM2.5 暴露是否与儿童新发哮喘有关？请找队列研究和系统综述，注意研究对象是儿童而不是成年人。
  - id: NL25
    broad_field: medical_and_health_sciences
    focus: pharmacology_and_clinical_trials
    prompt_zh: >-
      治疗阿尔茨海默病的抗淀粉样蛋白抗体有哪些疗效和常见风险？请找随机临床试验及其综述，并区分不同药物。
  - id: NL26
    broad_field: agricultural_and_veterinary_sciences
    focus: veterinary_sciences
    prompt_zh: >-
      奶牛干奶期采用选择性抗生素治疗能否减少用药而不增加乳房炎？请找农场试验或系统综述。
  - id: NL27
    broad_field: social_sciences
    focus: education
    prompt_zh: >-
      疫情期间学校停课或线上教学是否扩大了学生之间的学习差距？请找使用成绩数据的实证研究或综述。
  - id: NL28
    broad_field: social_sciences
    focus: law_and_public_policy
    prompt_zh: >-
      刑事司法中使用算法风险评估有哪些公平性争议？请找实证研究以及讨论法律或政策影响的学术论文。
  - id: NL29
    broad_field: humanities_and_arts
    focus: philosophy_and_ethics
    prompt_zh: >-
      在人工智能参与决策时，“给出解释”与“证明决定正当”有什么区别？请找直接讨论这个问题的哲学或伦理学论文。
  - id: NL30
    broad_field: humanities_and_arts
    focus: linguistics_and_cultural_studies
    prompt_zh: >-
      学校教育和社区日常使用，哪种更有助于濒危语言复兴？请找具体语言社区的案例研究或综述。
