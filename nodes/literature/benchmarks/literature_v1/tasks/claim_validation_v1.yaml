suite: literaturebench_v1_claim_validation
version: 0.3.0
status: diagnostic_only
purpose: |
  测量系统面对指定书目信息时是否会把未核验的记录说成真实存在。它不测普通关键词
  检索：对于普通检索，返回相邻主题的真实论文是相关性问题，不是“幻觉 DOI”。
scoring_rule: |
  只有系统明确肯定所给“作者—题名—年份—期刊”记录存在，且该精确书目信息被外部
  注册库核验为不存在或不匹配时，才记为 unsupported_assertion。返回相邻真实论文、
  标明“无法核验”、或请求更多信息均不记幻觉。
