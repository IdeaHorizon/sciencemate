context_config:
  memory_query: "scientific visualization conventions, domain plots, visual accessibility, figure review failures"
  kb_query: ""
  max_output_tokens: 8192
  temperature: 0.2

required_input_artifact_types: []

required_output_artifact_types:
  - figure

completion_criteria:

expected_inputs:
  visual_requests: |
    一个或多个科学可视化请求。每项：
      - intent（必填）：这张图要说明什么
      - asset_kind：auto | quantitative | scientific_image | spatial_3d |
        molecular_material | particle_trajectory | geospatial_field |
        electronic_structure | schematic | generative_illustration | composite
      - purpose：exploration | diagnostic | publication | presentation |
        interactive | report（导出尺寸/DPI/格式的默认值按它选；不是身份）
      - source_artifact_ids / constraints / style_intent / spec /
        generative_allowed（均可选）
      - quality_mode 已废除（判决拆除）：传了会被忽略并记一条 deprecation
        见证，不报错。
  figure_requests: "旧调用方兼容别名；进入节点后按 visual_requests 解释。"
  source_artifacts: "通常为 Experiment 产生的 clean_results/dataset，也可为科学图像、空间/三维或分子材料文件 artifact。"

expected_outputs:
  figure: |
    唯一完成契约：render_figure 铸出的 figure 记录，携带源数据 artifact
    ids+hash、冻结渲染代码路径+hash、输出文件+hash、findings[]（机械审计 +
    VLM 证人 + 缺席事实）、caption/alt_text 与 replay 命令。没有
    status/quality_mode/verdict —— 够不够发表由 referee 与用户裁。

handoff_policy:
  strategy: summary
  max_tokens: 1600

max_turns: 40
callable_nodes: []
