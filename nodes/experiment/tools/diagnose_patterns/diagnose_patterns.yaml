# ═════════════════════════════════════════════════════════════════════════════
# 6. 调度器终止消息 (Scheduler)  —— 049-1
# ═════════════════════════════════════════════════════════════════════════════
# 这些行是调度器自己写进作业 stderr（-j oe 时进 stdout）的，不是程序输出。
# 来源（源码，官方文档均无此文案）：
#   Slurm  src/slurmd/slurmstepd/req.c（_handle_signal_container 的 SIG_* 横幅；
#          ≤24.11 前缀 "slurmstepd: error: "，≥25.05 前缀 "[<时间>] error: "——所以只锚横幅正文）；
#          src/plugins/task/cgroup/task_cgroup_memory.c（cgroup OOM，17.11–22.05 写
#          "oom-kill event(s)"，≥23.02 写 "oom_kill event"；≤17.02 写 "Exceeded … memory limit at some point."）；
#          src/interfaces/jobacct_gather.c（OverMemoryKill："… exceeded memory limit (a > b), being killed"）。
#   OpenPBS/Torque  src/resmom/mom_main.c："=>> PBS: job killed: <资源> <用量> exceeded limit <上限>"。
# 整行锚定（^.*…$）：让本条在同一行上机械覆盖 generic_compile_error 的 "error:" 解释，
# 否则模型会先看到「通用编译错误」。事实与判据见
# skills/scheduler-longrun/references/{slurm,pbs-torque}-terminal-facts.md。

  - id: "slurm_job_cancelled_time_limit"
    regex: '^.*\*\*\* (?:JOB|STEP) \S+ ON \S+ CANCELLED AT \S+ DUE TO TIME LIMIT \*\*\*.*$'
    category: "resource"
    severity: "critical"
    confidence: 0.98
    description: "Slurm 作业/step 到达 walltime 被调度器结束（sacct State=TIMEOUT）"
    generic_fix: "这是墙钟到点被杀，不是程序错误；按 sacct 的 TIMEOUT 收尾（不算成功、不算符合预期终止），部分产物不进结果；重投前加大 walltime 或改用检查点续跑"
    context_hint: "ExitCode 低位为 0（0:0 / 0:15）不表示跑完；终态以 sacct allocation 行 State 为准"
    auto_fixable: false

  - id: "slurm_job_cancelled_preemption_or_requeue"
    regex: '^.*\*\*\* (?:JOB|STEP) \S+ ON \S+ CANCELLED AT \S+ DUE TO (?:PREEMPTION|JOB REQUEUE) \*\*\*.*$'
    category: "resource"
    severity: "error"
    confidence: 0.98
    description: "Slurm 作业被抢占或被重排（sacct State=PREEMPTED / 同一 JobID 会从头再跑）"
    generic_fix: "不是程序错误；先查 sacct -D 看同一 JobID 是否已重跑，重跑会从头执行并可能覆盖/追加同一批输出文件；只收最后一次运行的产物"
    context_hint: "PREEMPTED 的 ExitCode 通常是 0:0；被抢占又在 GraceTime 内自己结束的作业也按抢占处理"
    auto_fixable: false

  - id: "slurm_job_cancelled_node_failure"
    regex: '^.*\*\*\* (?:JOB|STEP) \S+ ON \S+ CANCELLED AT \S+ DUE TO NODE FAILURE.*\*\*\*.*$'
    category: "resource"
    severity: "critical"
    confidence: 0.98
    description: "Slurm 分配节点故障导致作业结束（sacct State=NODE_FAIL）"
    generic_fix: "不是程序错误；作业没有返回过退出码（ExitCode 0:0）；查 sacct 是否已 requeue 后再决定重投，重投时避开该节点或让调度器选"
    context_hint: "NODE_FAIL 不算成功也不算符合预期终止；Requeue=1 时同一 JobID 的新记录会盖住这条"
    auto_fixable: false

  - id: "slurm_job_cancelled_by_signal"
    regex: '^.*\*\*\* (?:JOB|STEP) \S+ ON \S+ CANCELLED AT \S+(?: DUE to SIGNAL [^*]+)? \*\*\*.*$'
    category: "runtime"
    severity: "error"
    confidence: 0.98
    description: "Slurm 作业被 scancel / SIGTERM / SIGKILL 显式取消（sacct State=CANCELLED by <uid>）"
    generic_fix: "先查 sacct 的 State（CANCELLED by <uid> 说明谁取消的），确认是计划内取消还是意外；取消的作业不算成功，只有 cancel_job 记录的计划内取消才按计划收尾"
    context_hint: "≤24.11 的横幅只有 CANCELLED AT <时间>，≥25.05 带 DUE to SIGNAL <名>；都不带原因——OverMemoryKill 杀作业时也打这条横幅（前后有 exceeded memory limit 行，sacct 记 FAILED 0:9）"
    auto_fixable: false

  - id: "slurm_job_failed_or_task_failure"
    regex: '^.*\*\*\* (?:JOB|STEP) \S+ ON \S+ (?:FAILED \(non-zero exit code or other failure mode\)|CANCELLED AT \S+ DUE TO TASK FAILURE) \*\*\*.*$'
    category: "runtime"
    severity: "error"
    confidence: 0.98
    description: "Slurm 因批处理脚本非零退出或 --kill-on-bad-exit 的任务失败而结束其余 step"
    generic_fix: "真正的错误在这条横幅之前的程序输出里；按 sacct 的 FAILED/ExitCode 收尾，定位失败的 step（sacct 不带 -X 看 step 行）"
    context_hint: "这条横幅本身不是根因"
    auto_fixable: false

  - id: "slurm_step_oom_killed"
    regex: '^.*(?:Detected \d+ oom[-_]kill event|Exceeded (?:job|step) memory limit|exceeded (?:virtual )?memory limit \(\d+ > \d+\), being killed).*$'
    category: "memory"
    severity: "critical"
    confidence: 0.98
    description: "Slurm 报告 step 内进程被 cgroup OOM 杀掉或被 OverMemoryKill 杀掉（sacct step 行 State=OUT_OF_MEMORY）"
    generic_fix: "内存超过申请量：按 sacct step 行的 MaxRSS 重新申请内存（--mem / --mem-per-cpu）或减少每节点进程数；cgroup OOM 下作业可能仍显示 COMPLETED，要看 step 行"
    context_hint: "cgroup OOM 只杀一个进程、step 继续跑；OverMemoryKill 杀整个 step 且基于轮询有延迟"
    auto_fixable: false

  - id: "pbs_job_killed_time_or_cpu_limit"
    regex: '^.*=>> PBS: job killed: (?:(?:walltime|cput|pcput|ncpus)\b.*exceeded limit|cput job total \d+ secs exceeded limit).*$'
    category: "resource"
    severity: "critical"
    confidence: 0.98
    description: "PBS Pro/OpenPBS/Torque 的 MoM 因 walltime / cput / ncpus 超限杀掉作业"
    generic_fix: "这是时间/CPU 限制到点被杀，不是程序错误；按 qstat 的终态与 Exit_status 收尾（不算成功）；重投前加大 walltime 或改用检查点续跑"
    context_hint: "PBS Pro 的 Exit_status 会是 128+信号（如 143/137），Torque 可能是 -11 或 >255 的值；具体数值分不出超时与其他信号死亡，这行文案才是证据"
    auto_fixable: false

  - id: "pbs_job_killed_memory_limit"
    regex: '^.*=>> PBS: job killed: (?:(?:mem|vmem|pvmem)\b.*exceeded limit|mem job total \d+ kb exceeded limit).*$'
    category: "memory"
    severity: "critical"
    confidence: 0.98
    description: "PBS Pro/OpenPBS/Torque 的 MoM 因 mem / vmem / pvmem 超限杀掉作业"
    generic_fix: "内存超过申请量：按这行给出的用量重新申请 mem/vmem 或减少每节点进程数；不算成功"
    context_hint: "Torque 记 -10（OVERLIMIT_MEM）；PBS Pro 只在 enforce_mem 时按 mem 杀"
    auto_fixable: false
