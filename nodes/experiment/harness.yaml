# experiment.yaml —— AI4S experiment node v0.14（v3 自然执行循环）
#
# 职责边界：执行 + 监控 + 原始事实 + 机械质量检查 + 偏离披露 + 统一交付

node_type: experiment
version: "0.14"
risk_level: high

system_prompt: |
  **语言要求：默认用中文回复；命令、路径和代码保持英文。**

  你是 Experiment 执行节点。开局框架会给你一页纸：目标、要交付什么、你能写哪里、
  有什么调度器与授权。之后就是正常干活的循环：读、探查、写、跑、提交作业、等、
  读日志、按需 `load_skill`、拿不准就问人、干不下去就 `report_blocker`。

  你不需要为动作做任何登记或声明：框架自己记录每次动作做了什么、写了什么、
  作业到了什么终态。写只落在可写根里，baseline 只读。有界、同步、几分钟内出结果的
  build / test / check 直接 `safe_run_bash`；会活过本次调用、需要调度资源、限额、取消或
  恢复的工作（长构建、simulation、并行启动器）才交给 `submit_job`。

  复杂任务（多阶段构建、长模拟、参数矩阵、checkpoint/restart）先在白板上写一份
  简洁的工作计划：阶段与依赖、正式输入与环境前提、哪些本地跑哪些交调度器、每阶段
  怎么验证、失败了怎么分支、最终交付什么。它是你自己的工作假设，不是框架的权威：
  新证据改变判断就直接改它并写明原因；实际发生的事实永远比计划文字优先。小任务不
  用先写计划，直接做。

  专业方法按任务选择，不是每项都加载。任务涉及下列领域时，在首次确定具体参数
  或执行方案前，先 `load_skill` 读取对应方法及相关参考；同一 run 已读且仍适用的
  内容直接复用。读取材料、复述已证事实不必等待加载。加载失败时说明缺口，依据
  已有可靠证据继续或交代未验证部分，不因此新增执行或交付门槛。
  源码构建、运行环境或并行布局/性能诊断
  `hpc-build`；AI 训练、评估、checkpoint 恢复或推理 `ai-workloads`；GPU 后端
  `gpu-hpc-porting`；调度器或长任务前 `scheduler-longrun`；正式输入缺失
  `formal-input-recovery`；资源/软件/数据/凭证拿不到或撞上平台限制
  `feasibility-ladder`；执行 scientific 任务和整理其证据时 `scientific-results`。

  结束只有一个入口：`finish(outcome, summary, deliverables, verification, limitations, next_step, blocker)`。
  raw_results、clean_results、experiment_log 由 finish 自动生成并冻结，不逐个 save_artifact / freeze_artifact。
  原任务与正式要求由框架保存，不用补内部验收数组。自然任务在 verification 中逐项解释
  任务要求（无需逐字引用），说明用哪些产物（file/glob）或只读检查命令（check）验证，以及为什么足够。
  例如一项可同时给出结果文件的 file 检查与核对其内容的 check；路径用绝对路径或相对
  工具工作区，check 内相对路径按其 cwd（默认工具工作区）解释。框架真的执行检查，不接受自报 passed。你负责检查是否
  覆盖全部任务要求；只验证文件存在通常不能证明内容、次数或数值正确。检查方法可以
  按实际情况调整，但不能降低原要求，已有正式检查也不会被替换。不需要预先声明方法，
  不为补核验重做已完成的载荷；真正不清楚时只问具体业务问题。
  如实说结果。框架自己核对交付物在不在、是不是本 run 写出的、检查命令过不过、
  作业是不是都终态了；success 站不住时它一次告诉你缺什么、哪些诚实的 outcome
  可达。partial / failed / blocked / cancelled 永远可达，不要为了 success 绕路。
rules:
  - "中文回复；命令、路径、代码用英文。"
  - "只写框架授权的可写根；baseline 只读，不改源码基线。"
  - "不得伪造输出：失败就记失败，附 returncode、stderr 与证据路径；没验证过就说没验证过；复现不了就写原因未明。"
  - "会活过本次调用、需要调度资源/限额/取消恢复的工作（长构建、simulation、并行启动器）用 submit_job 交给调度器，读 `scheduler-longrun`；有界同步的 build/test/check 直接 safe_run_bash；禁 nohup、裸 `&`、手工后台。"
  - "高危动作、出网、改上游目标走服务端 gate，不得绕过；被拒的调用不原样重发，按返回给出的下一步走。"
  - "缺正式输入不自造：调 `dispatch_data_request(spec_id=..., user_note=...)` 走受管 Data 子节点，回来后用 `reconcile_data_dispatch()` 验收。"
  - "影响结果的 scientific 计算：有精确 prereg 绑定时只执行其结构化参数；无 prereg 时如实记录所选参数及来源。准备动作不必重复填参数，witness 不等于程序已实际使用，偏离必须披露。"
  - "结束调 `finish`：outcome、如实的摘要、实际交付、验收方法与限制。自然要求的 verification 是专业解释，不是修改任务或自报通过；诚实的 partial / failed / blocked / cancelled 不必编造核验。"
  - "**问人判据**：owner 独有且不问就停车才问（源不可达、凭证、越出资源包络、上游目标变更）。"
skills:
  - claim_evidence_link
  # 049-0：节点自己的 skill 进 L1 索引（只渲染名字 + description + 适用 + 取法，正文仍按需
  # load_skill）。此前 7 个节点 skill 一个都不在索引里，模型只有 list_skills 才撞得见——
  # 活体里 hpc-build 全程只被读 7 次。gpu-hpc-porting 仍走 gpu_skill_injector 条件注入
  # （test_gpu_skill_is_conditional_hook_not_global_context），不进这里。
  - feasibility-ladder
  - formal-input-recovery
  - hpc-build
  - ai-workloads
  - scheduler-longrun
  - scientific-results

tools:
  # ── v3 模型面（S1d）：只呈现自然工作循环。每一项按"是否属于模型自然工作循环"留或删。
  # 退役出模型面（框架内部仍有对应事实机制）：classify_experiment_scope → bootstrap 自动建立；
  # declare_execution_route / declare_execution_envelope / 路线修订 → 无对应物（账本记事实）；
  # verify_external_job_execution / finalize_external_job / reconcile_external_submission →
  # 调度器终态自动入账、adapter reconcile；record_operation_completion /
  # preview_experiment_contract / supersede_closure_draft / supersede_experiment_log /
  # record_unknown_orphan / resolve_unknown_orphan → finish 与账本。
  # 旧构建证据 artifact `declared_route`（route_type / activities / env_domains / expected_artifacts，
  # 校验器 tools/build_contract.py）只在 v2 build gate 回退路径消费；v3 run 不读它、也不要求模型写它。
  # 保留在自然循环里：web_fetch/web_search（查官方文档）、write_scratchpad（白板）、
  # create_claim（KB 死路沉淀）、preflight_build_resources（纯建议、从不阻塞）。
  # run_node（裸派子节点）不属于 experiment 的自然循环：数据请求走 dispatch_data_request。
  # 读与探查
  - read_file
  - list_files
  - search_files
  - read_artifact
  - list_artifacts
  - read_external_artifact
  - probe_toolchain
  - discover_resources
  - recommend_resources
  - preflight_build_resources
  - describe_acquisition_capabilities
  # 写、跑、取
  - safe_write_file
  - safe_run_bash
  - safe_execute_python
  - fetch_resource
  - web_fetch
  - web_search
  - request_network_access
  # 受管作业
  - submit_job
  - job_status
  - check_external_job_health
  - wait_for_external_job
  - cancel_job
  # 正式输入（数据契约，不在 060 范围，原样保留）
  - validate_data_request_spec
  - dispatch_data_request
  - reconcile_data_dispatch
  - verify_dataset_consumption
  - record_data_delivery_outcome
  - authorize_experiment_fallback
  - verify_experiment_fallback_inputs
  # 记录、知识、人
  - save_artifact
  - freeze_artifact
  - write_scratchpad
  - memory_note
  - memory_recall
  - search_kb
  - create_claim
  - get_kb_record
  - read_profile
  - request_human_input
  - consult_other_model
  - report_blocker
  # 唯一收尾入口
  - finish
loop_hooks:
  # ── v3（S1d）：启动建立 A → 事实视图 → 记账兜底；物理安全观测保留；路线/收尾/沉淀类 advisor 退出。
  # 每个被移除 hook 原来保护的不变量与承接者，见 docs/experiment_governing_v3.md §S1d 附表。
  - experiment_v3_bootstrap          # v3 A 的唯一启动点；turn 1 只注入一页事实清单
  - experiment_delta_view            # 有界事实视图
  - experiment_ledger_recorder       # 记账兜底（只记录）
  - experiment_live_effect_unsettled # on_end 事实：结束时仍有开放作业则记账（不是终止门，终止门归 Core）
  - project_orientation
  - experiment_progress_reporter
  - task_briefing                    # turn-1 用任务正文做 KB 检索（事实，不是指令）
  - data_source_reachability_preflight
  - foreign_owner_blocker_ask_nudge
  - platform_limit_ask_nudge
  - gpu_skill_injector
  - experiment_scheduler_facts_router
  - scratchpad
  - generic_failure_detector
  - repeated_error_detector
  - output_corruption_sentinel
  - high_risk_command_audit          # run 结束机械对账高危命令：物理安全，保留
  - preprocessing_boundary_audit     # 前处理产物生成行为对账：数据边界，保留
  - repro_snapshot
  - callee_contracts
context_config:
  memory_query: "experiment execution, scientific inputs, parameters, raw evidence, quality checks, deviations, reproducibility"
  kb_query: "scientific method, measurement quality, validation checks, reproducibility"
  max_output_tokens: 16384
  # 2026-06-12 两次实测校准：temp=1.0 → 8次参数损坏/104轮；temp=0.2 → 损坏率
  # 没降（7次/51轮）反而引发复读锁死（58% 轮次逐字复读 hook 注入文本，低温
  # 贪心解码+自我条件化）。结论：参数损坏与温度无关（deepseek 解码层问题，由
  # output_corruption_sentinel 兜底）；温度只影响复读 → 取 0.6 避免锁死。
  temperature: 0.6

# 每个 Experiment run 的必产出证据三件套。此字段表达产出契约，不表达调用方
# 回传哪些 artifact 或如何进行后处理；这些行为不由 Experiment 节点配置决定。
# 顺序即冻结顺序：raw → clean → log（与 rules 中「冻结顺序 raw→clean→log」一致）。
# 集合成员不变，只把展示顺序改成与实际执行一致 —— 模型按这份清单理解先后关系，
# 倒着写会诱导它先建 log 再补证据。
required_output_artifact_types:
  - raw_results
  - clean_results
  - experiment_log

expected_inputs:
  experiment_spec: |
    （可选）本次任务说明：目标软件/模型、要执行或验证的工作、预期交付、资源或
    时间约束。精确绑定 prereg 时它不能覆盖该绑定的科学参数；没有 prereg 的
    scientific 探索则按任务目标选择参数并如实记录来源，不能把模型选择写成用户承诺。
  prereg_assignment: |
    调用方对本 run 的唯一预注册安排。`kind=bound` 必须给出精确
    artifact_id/version/content_hash；`kind=none` 必须给出 reason，表示本 run
    没有 governing prereg，但不替 Experiment 决定 scientific/operation 分类。
    `kind=pending` 只能含 kind，表示 scientific formal input 尚未可用；省略此键
    表示调用方没有提供 prereg 信号，不等于 pending 或 none。项目 catalog 只作为
    候选观察，不能授权。任何 variant 的额外键都会被拒。
  stage: |
    （兼容输入，可省略）旧调用方给出的 `simulation`、`diagnostic` 或
    `toolchain_build` 提示。它不能替代 Experiment 的路线规划，不能授予路径或资源
    权限，也不能单独决定 operation/scientific。prereg 是 scientific 的充分条件但
    不是必要条件；scope 取自本 run 的正式任务权威。
  dataset_artifact_id: |
    （可选）上游已有的 `dataset` artifact ID。实际消费时把 ID 传入执行工具，
    执行入口自动检查包结构并记录当时的 artifact 身份；无正式请求时不必另起
    Data 或补建 spec。结构检查不证明科学适用性、正式来源或全部文件内容。
    已有正式 Data 请求仍由 `verify_dataset_consumption` 按原 spec 验收；
    受约束 fallback 仍按原授权与验收规则处理，不能借普通包绕过。
    不得传本地猜测路径来替代 dataset。
    示例：`dataset__abc12345`。
  input_package_artifact_id: |
    （可选）本次动作真实消费的数据/输入包 artifact ID。把同一 ID 传给实际
    消费它的执行工具，供执行前按已有请求核验或按普通包做结构检查；不消费时
    不要虚构 selector。观察到的版本/内容身份不是 Core 派发的精确输入承诺。
    执行入口按真实生命周期选择：有界同步计算可走安全本地执行，需要跨调用存活、
    调度资源、取消或恢复的计算走受管作业。
  execution_params: |
    （影响结果的 scientific 计算）传给执行工具的参数 witness。精确绑定 prereg 时
    必须与其结构化执行合同完全一致；没有 prereg 的探索任务则记录所选参数及来源。
    准备、编译和探查动作不必重复填写，用户也不需要提供内部 ID。该对象只证明工具
    收到的参数，不证明程序实际使用；实际使用还需命令、配置、日志或输出证据。
    示例：`{scientific_params: {temperature_K: 300}, runtime_params: {threads: 4}}`。
  path_roles: "（可选，由调用方在启动前提供）本 run 的受信任绝对路径角色。scheduler 的外部 workdir/输出只接受 writable 的 run_root 或 build_root；省略时 Experiment 使用 Core 分配的默认 run_root。approved_write_root 仅用于受限普通写入，不能作为 scheduler workdir 或输出目录。"

# 哪些 node input 承载本轮任务正文，是 Experiment 自己的机器可读事实源；不能从
# expected_inputs 的人类说明、键名或值类型猜测。canonical 必须属于 expected_inputs。
task_prose_input_keys:
  - experiment_spec

# 历史兼容别名不是正式输入契约：当前只在 hooks 与 fixtures 中存在。owner: lujy
# （Experiment 节点）；删除条件：fixtures、真实调用方与支持窗口内可恢复 loop_seed
# 都不再出现该别名，并有回归证明 legacy key 不再静默用于 briefing 或 termination anchor。
task_prose_compatibility_input_keys:
  - experiment_focus

expected_outputs:
  raw_results: "由统一 finish 从持久事实生成并冻结：包含本 run 的正式输入/参数快照、动作与作业事实、交付物和可用原始输出引用；缺失或未执行必须有明确原因。"
  clean_results: "由统一 finish 生成并冻结：整理机械验收、适用的质量检查、缺口、矛盾及动作/作业状态；不得把未做的检查或科学结论写成已验证事实。"
  experiment_log: "由统一 finish 生成并冻结：保存摘要、outcome、缺口、矛盾及指向同一交付上下文的 ledger pointer；输入、参数和动作事实由 raw/clean/context 持有并经该指针关联。Experiment 不替下游作科学裁决。"

handoff_policy:
  strategy: summary
  max_tokens: 2000


# scientific experiment 的当前后处理链是 reviewer -> decision package；仅在 review
# 有效且无框架覆盖时，运行时才将裁决顺延到 Analysis(hypothesis)。curator 已退出默认
# post-producing flow，仅作为按需后台节点。
# 红线：review 失败时立即呈递失败决策包并继续拦截下游。顺延不是放行 —— 在
# Analysis 完成前，其他 producing 节点仍被机械拦截。
# Core 目前只接受静态 post_run_flow，尚不能按 run contract 与调用来源切换。
# Core 接入后，operation 应将其冻结证据交回直接调用方，并跳过 reviewer、decision
# package 和 Analysis；Experiment 只记录来源和就绪状态，不选择下游。
post_run_flow: review_curate

max_turns: 0       # 语义由 Core 决定；当前默认无上限，设 HARNESS_DEFAULT_MAX_TURNS=<N> 可限制！

callable_nodes:
  - data                      # v2.0：缺正式输入直接调数据服务，不再打回 orchestrator
