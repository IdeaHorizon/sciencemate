node_inputs:
  path_roles:
    experiment_root: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work
    run_root: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run
  experiment_focus: |
    这是 VASP case1：aimd_simulations__temperature_300 的 SSH + mpirun 运行任务。
    本任务复用已经编译好的 VASP 6.5.1 `vasp_std`，不重新编译 VASP；通过免密 SSH 在
    gnr-cu02/gnr-cu03/gnr-cu04 上直接用 mpirun 启动计算，不使用 SLURM。

    重要说明：
    - 用户指定目标节点为 gnr-cu02, gnr-cu03, gnr-cu04。
    - 用户说明可使用已编译好的 gnr 平台 `vasp_std`。因此运行前必须在这三个目标节点上做
      `ldd` 检查；如果该二进制在 gnr 节点上缺库或 ABI 不兼容，必须停止并记录 blocker，
      不要擅自重编译或换节点。
    - 如果三节点 mpirun 分发失败，不允许自动降级成单节点继续跑；必须停止、记录 blocker，
      并 `request_human_input` 让用户决定是否改为单节点、改资源或修复 SSH/MPI。
    - 用户授权本 case1 任务可以把运行副本中的 KPOINTS 从 `3 3 3` 改为 Gamma-only `1 1 1`。
      这是性能/范围变更，必须写入 experiment_log；不得把该结果伪装成原始 3x3x3 设置下的证据。

    科学目标：
    1. 使用 case1 输入目录中的 `predecessor/` 先完成 tC40 predecessor 弛豫。
    2. predecessor 产生合格 `CONTCAR` 后，将其复制为 AIMD 阶段的 `POSCAR`。
    3. 使用 case1 根目录 AIMD 输入参数运行 300 K AIMD。
    4. 冻结 `experiment_log`，记录 predecessor/AIMD 是否完成、关键输出路径、失败原因或 blocker。
    5. 本节点只产出 VASP predecessor/AIMD 运行证据；不做 snapshots band/gap postprocess，
       也不得仅凭本 run 声称 H24 validated/refuted。

    路径：
    - 提交端仓库: /mnt/beegfs/ai4s-test/ai4s-platform/test_20260625/harness-framework
    - 本地参考输入目录: /home/lujy/2026-ai4s-platform-project/test1-vasp/case1.aimd_simulations__temperature_300
    - 集群 case1 输入目录: /mnt/beegfs/ai4s-test/ai4s-platform/test1_vasp/case1.aimd_simulations__temperature_300
    - 已编译 VASP: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-gnr-build/vasp.6.5.1/bin/vasp_std
    - 本 run 共享 workdir: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work
    - predecessor 运行目录: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/predecessor
    - AIMD 运行目录: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/aimd
    - logs/scripts 目录: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/logs

    输入事实：
    - case1/predecessor/POSCAR: C，320 原子。
    - case1/predecessor/INCAR/KPOINTS/POTCAR 是 predecessor 阶段输入。
    - case1 根目录 INCAR/KPOINTS/POTCAR 是 AIMD 阶段输入。
    - case1/structure.pending.json 声明 AIMD POSCAR 应来自 predecessor/CONTCAR。
    - AIMD INCAR 包含 `IBRION=0`、`MDALGO=2`、`NSW=5000`、`POTIM=1.0`、`TEBEG=300`、`TEEND=300`。
    - 原始输入只读；所有复制、KPOINTS 修改和运行输出都必须在 workdir 的 run 目录副本中完成。

    可接受的参数变更：
    - 仅允许在 workdir 运行副本中把 predecessor 和 AIMD 阶段的 KPOINTS 写为：
      `Automatic mesh generated by experiment node (user-approved reduced-k run)`
      `0`
      `Gamma`
      `1 1 1`
      `0 0 0`
    - 不要修改原始输入目录下的 KPOINTS。
    - 不要修改 `ENCUT=520`、`PREC=Accurate`、`EDIFF=1E-6`、AIMD 温度和时间步等科学参数。
    - 如果为了 preflight 缩短 `NSW`，必须单独标注为 smoke/preflight，不得作为正式 AIMD 结果。

    目标节点与运行方式：
    - 目标 hosts: gnr-cu02, gnr-cu03, gnr-cu04
    - 调度器: 无；本任务使用 passwordless SSH + mpirun
    - 禁止使用 `submit_job`、`sbatch`、`srun`
    - 每个目标节点必须先检查:
      - `hostname`
      - `whoami`
      - `nproc`
      - `/mnt/beegfs/ai4s-test` 共享盘可见
      - `source /opt/intel/oneapi/setvars.sh --force` 可用
      - `which mpirun`
      - `ldd --version | head -1`
      - `ulimit -s`
    - 运行脚本必须设置:
      - `set -eo pipefail`
      - `ulimit -s unlimited`
      - `source /opt/intel/oneapi/setvars.sh --force`
      - `export MKL_NUM_THREADS=1`
      - `export OMP_STACKSIZE=512M`
      - `export OMP_PROC_BIND=close`
      - `export OMP_PLACES=cores`

    VASP 二进制检查：
    - 必须确认 `/mnt/beegfs/ai4s-test/ai4s-platform/vasp-gnr-build/vasp.6.5.1/bin/vasp_std`
      存在且可执行。
    - 必须在 gnr-cu02/gnr-cu03/gnr-cu04 上分别运行:
      `source /opt/intel/oneapi/setvars.sh --force; ldd <vasp_std> | grep "not found\|GLIBC_" || echo libs-ok`
    - 若任一节点出现 `not found`、`GLIBC_* not found` 或 MPI/oneAPI 运行时缺失，停止任务并冻结
      environment/toolchain blocker。

    推荐初始资源布局：
    - 每节点 192 CPU cores
    - 初始布局: 48 MPI ranks / node, 4 OpenMP threads / rank
    - total MPI ranks = 144
    - total CPU threads = 576
    - `OMP_NUM_THREADS=4`
    - `MKL_NUM_THREADS=1`
    - 如 preflight 显示某节点不是 192 cores 或负载异常，必须降低 ranks_per_node 或 threads_per_rank 后再请求用户确认。

    非 SLURM mpirun 脚本要求：
    - 在 logs/scripts 目录生成可审计脚本，例如：
      `/mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/logs/run_case1_aimd_ssh.sh`
    - 生成 hostfile，例如：
      `/mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/logs/hosts.ssh`
      内容应按确认后的 ranks_per_node 写入 gnr-cu02/gnr-cu03/gnr-cu04。
    - 推荐 Intel MPI 启动形式:
      `mpirun -bootstrap ssh -hosts gnr-cu02,gnr-cu03,gnr-cu04 -ppn 48 -np 144 -genv OMP_NUM_THREADS 4 -genv MKL_NUM_THREADS 1 <vasp_std>`
    - stdout/stderr 必须写入 logs 目录，文件名包含阶段名和时间戳。
    - 为避免 scope_guard 误判 heredoc 中的变量路径，运行脚本里的日志重定向必须使用固定绝对路径，
      不要使用 `${WORKDIR}/${STDOUT_LOG}`、`${LOGDIR}/${name}` 这类变量拼接路径。
    - 如果脚本创建被 scope_guard 拦截，改成固定绝对路径日志和不含变量路径重定向的脚本；
      不要改写到 harness-framework 仓库路径下，也不要重复启动计算。
    - 如果启动后发现只有一个节点存在 `vasp_std` 进程，必须立即停止该错误任务并记录 blocker；
      不得把单节点超卖运行写成成功。

    执行顺序：
    1. 检查 case1 集群输入目录和四个关键输入文件：
       `predecessor/INCAR`、`predecessor/POSCAR`、`predecessor/KPOINTS`、`predecessor/POTCAR`，
       以及根目录 `INCAR`、`KPOINTS`、`POTCAR`。
    2. 创建 declared route / workspace 记录，声明:
       - workdir: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work
       - run_dir: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run
       - logs_dir: /mnt/beegfs/ai4s-test/ai4s-platform/vasp-case1-aimd-300-work/run/logs
    3. 复制 predecessor 输入到 workdir/run/predecessor，并在副本中把 KPOINTS 改成 1x1x1。
    4. 若已有有效 predecessor/CONTCAR，可先验证并复用；否则运行 predecessor。
    5. predecessor 完成后复制 predecessor/CONTCAR 为 workdir/run/aimd/POSCAR。
    6. 复制根目录 AIMD 输入到 workdir/run/aimd，并在副本中把 KPOINTS 改成 1x1x1。
    7. 启动 AIMD 前必须 `request_human_input`，说明:
       - hosts
       - ranks_per_node
       - total MPI ranks
       - OpenMP threads
       - 是否会编译 VASP（本 fixture 默认不会）
       - VASP binary 路径
       - predecessor/AIMD workdir
       - stdout/stderr 日志路径
       - KPOINTS 已按用户授权从 3x3x3 改为 1x1x1
       - AIMD `NSW=5000` 可能是长任务
    8. 用户确认后用 SSH + mpirun 启动；不要重复启动相同阶段。
    9. 启动后必须在 60 秒内检查 gnr-cu02、gnr-cu03、gnr-cu04 都有 `vasp_std` 或 MPI worker 进程；
       若只有一个节点有进程，立即停止并记录 multi-node launch blocker。

    监控要求：
    - 不要使用长阻塞等待：单次 `sleep` 不超过 60 秒，单次 `safe_run_bash timeout` 不超过 90 秒。
    - 长任务启动后给用户 watch 命令，例如：
      - `ps -ef | grep vasp_std`
      - `for h in gnr-cu02 gnr-cu03 gnr-cu04; do ssh $h "pgrep -af 'vasp_std|mpirun|hydra|pmi_proxy' || echo no-vasp"; done`
      - `tail -f <stdout_log>`
      - `tail -30 <run_dir>/OSZICAR`
      - `ls -lh <run_dir>/OUTCAR <run_dir>/OSZICAR <run_dir>/XDATCAR <run_dir>/CONTCAR`
    - 如果 mpirun 已在后台/远程运行，agent 不应重复启动第二个相同任务。

    完成标准：
    - predecessor:
      - mpirun 正常退出 0，或日志中有明确可解释的完成状态；
      - `OSZICAR` 有 ionic-step 能量行；
      - `CONTCAR` 非空且结构有效。
    - AIMD:
      - mpirun 正常退出 0，或达到明确可解释的阶段性输出；
      - `OUTCAR`、`OSZICAR`、`XDATCAR`、`CONTCAR` 至少一组可归档；
      - experiment_log 记录实际完成步数、是否完整达到 `NSW=5000`、KPOINTS reduced-k 变更、hosts/ranks/threads。
    - 若任一阶段失败，必须记录最后一个真实错误、日志路径、资源配置和下一步建议，不得伪造完成。
    - 冻结 `experiment_log`；若没有后续 postprocess 证据，verdict 必须为 `inconclusive`。

