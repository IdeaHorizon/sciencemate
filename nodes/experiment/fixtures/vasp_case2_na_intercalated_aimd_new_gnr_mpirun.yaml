    4. 解析 `candidate_structures.json`，给出候选收敛可能性排序和理由。
    5. 按排序为第一个候选创建独立 predecessor 目录，例如 `run/predecessor/site_01`，
       复制 `predecessor/INCAR/KPOINTS/POTCAR`，并把 `candidates/site_01/POSCAR` 复制为该目录 `POSCAR`。
    6. 运行该 candidate 的 predecessor；若已有有效 `run/predecessor/site_XX/CONTCAR`，可先验证并复用。
    7. 若当前 candidate predecessor 失败，记录证据并 `request_human_input`，再按排序尝试下一个 candidate。
