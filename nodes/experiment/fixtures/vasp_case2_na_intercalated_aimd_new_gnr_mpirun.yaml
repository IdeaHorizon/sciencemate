    候选结构选择策略：
    - 这些 candidates 是 data 节点给出的备选前处理结构，用于处理不同 Na 插层位点的收敛风险。
    - experiment 节点应先读取并解析 `candidate_structures.json`，按主观收敛可能性从高到低排序后尝试。
    - 排序依据必须写入 scratchpad 和 experiment_log，至少考虑：
      1. `hard_collision=false` 优先于有硬碰撞的候选；
      2. `geometry.valid=true` 优先；
      3. `minimum_host_distance_angstrom` 越大通常越不容易发生初始几何冲突，优先级越高；
      4. `minimum_pair_distance_angstrom` 过小可能表示宿主结构本身有短键风险，需记录；
      5. `selected_as_primary=true` 是 data 节点推荐，但如果几何指标明显更差，可以降级并说明理由。
    - 当前输入中已观察到的局部信息：
