    - 每个候选必须使用独立 predecessor 目录：
      `/mnt/beegfs/ai4s-test/ai4s-platform/vasp-case2-na-aimd-new-gnr-work/run/predecessor/site_XX`
    - 尝试候选时，应把对应 `candidates/site_XX/POSCAR` 复制为该候选 predecessor 的 `POSCAR`，
