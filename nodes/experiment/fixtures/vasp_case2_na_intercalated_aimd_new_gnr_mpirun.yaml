    - 如果某个候选 predecessor 失败、SCF 不收敛、结构崩坏、VASP 报几何/数值 blocker，
      必须记录证据路径、最后 OSZICAR/OUTCAR 摘要和失败原因，再请求人工确认是否尝试下一个候选。
    - 运行中如果出现明显“不可能在合理时间内收敛”的信号，不要机械等待到 walltime 或 NSW 用尽；
      应主动暂停、总结证据，并建议切换到下一个 site 方案。
    - 主动建议切换 site 的参考判据包括但不限于：
      1. 多个 ionic step 后最大力或能量没有下降趋势，且远高于 `EDIFFG=-0.02`；
      2. 单个 SCF step 长时间卡住，`OSZICAR`/`OUTCAR` 无进展，且 CPU 仍在消耗；
      3. `DAV`/`RMM` 反复达到 `NELM` 或接近 `NELM=160`，`rms(c)` 不降反升；
      4. `OUTCAR` 出现 ZBRENT、BRMIX、sub-space matrix、EDDDAV、ZHEGV、LAPACK、NaN、segmentation fault 等数值异常；
      5. 结构出现异常短距离、体积/晶格非物理变化、CONTCAR 空或明显损坏；
      6. 同一候选已经经历一次保守重启仍重复同类失败。
    - 主动建议切换时，agent 必须给出：
      - 当前 candidate_id；
      - 已完成 ionic steps / SCF iterations；
      - 最后一段 OSZICAR 摘要；
      - OUTCAR 中的错误或停滞证据；
      - 为什么判断继续等待收益低；
      - 下一个建议 candidate_id 及排序理由。
    - 未经用户确认，不得擅自杀掉正在运行的 VASP 或切换到下一个 site；
      但如果确认是单节点误分发、明显崩溃、输出损坏或 runaway 进程，可以先停止错误任务并记录原因。
    - 不要通过随意改变科学参数来“救”一个坏候选；优先切换到排序中下一个候选。
