      - `OUTCAR`、`OSZICAR`、`XDATCAR`、`CONTCAR` 至少一组可归档；
      - experiment_log 记录实际完成步数、是否完整达到 `NSW=5000`、hosts/ranks/threads。
    - 若任一阶段失败，必须记录最后一个真实错误、日志路径、资源配置和下一步建议，不得伪造完成。
    - 冻结 `experiment_log`；若没有后续 postprocess 证据，verdict 必须为 `inconclusive`。

