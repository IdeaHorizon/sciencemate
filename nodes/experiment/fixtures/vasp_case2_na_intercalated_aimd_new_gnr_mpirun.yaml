      - `ulimit -s unlimited`
      - `source /opt/intel/oneapi/setvars.sh --force`
      - `export MKL_NUM_THREADS=1`
      - `export OMP_STACKSIZE=512M`
      - `export OMP_PROC_BIND=close`
      - `export OMP_PLACES=cores`
    - stdout/stderr 必须写入 logs 目录，文件名包含阶段名和时间戳。
