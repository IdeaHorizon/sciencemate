      status: open
      created_at: "2026-06-16T00:00:00+00:00"
    content: |
      框架能在真实构建中确定性识别命名里程碑（configured / dependency-generated /
      target-built），只统计本轮新生成、位于 build 目录的产物；里程碑推进时不误报
      "连续无里程碑" soft 提示。

  - type: pre_registration
    name: E2E_Milestones_Test
    metadata:
      frozen: true
      frozen_at: "2026-06-16T00:00:00+00:00"
      freeze_reason: "第5步 E2E：验证最小里程碑确定性识别"
    content: |
