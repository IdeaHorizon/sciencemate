# E2E: scientific scope + submit_job(scheduler=local, stage=simulation) 全链路。
# 计算本体是真的（velocity-Verlet 辛积分器能量漂移），但科学价值不是重点，
# 重点是 scientific closure 那一整套闸门能否在 scheduler 路径上走通。
#
#   python run_node.py --harness experiment --no-interactive --bypass-permissions \
#     --fixture nodes/experiment/fixtures/e2e_local_scheduler_scientific.yaml \
#     --project-id e2e-local-sched-sci

node_inputs:
  prereg_artifact_id: pre_registration__Verlet_Energy_Drift_dt001
  experiment_focus: |
    按冻结 prereg 执行一次数值实验，用 scheduler=local 提交。

    一律用 scheduler=local（无论本机是否装有 SLURM，不要用 SLURM）；
    discover_resources 可能报告 sbatch 存在，这不影响，也不要因此判定不可行。
    积分器源码在本 harness-framework 仓库的 nodes/experiment/fixtures/verlet_e2e_src/verlet.py
    （先用 list_files 在仓库内定位其绝对路径；只读，不要修改或重写一份）。
    python3 在 PATH 上，无需安装任何依赖。

    流程：
    1. classify_experiment_scope: scope=scientific。
    2. 声明路线前先绑定 execution envelope（本 fixture 同时是 envelope 门的
       E2E 回归载体）：
       a. save_artifact(artifact_type="toolchain_lock", name="python3_runtime",
          content=<python3 --version 的实测输出>)，再 freeze_artifact 冻结它；
       b. declare_execution_envelope(route_step_id="verlet_simulation",
          assurance_class="evidence_bearing",
          target_profile_ref={id: "local-host",
          content_digest: "sha256:<对本机 profile 描述文本实际计算的 64 位 sha256>"},
          storage_binding={kind: "shared_filesystem",
          roles: {run: "run_root", output: "run_root"}},
          environment_lock_artifact_ids=[<第 a 步冻结的 toolchain_lock id>])，
          记下返回的 evidence_ref。
    3. 在任何 dry_run=false 的真提交前，declare_execution_route 必须冻结唯一 v2 step
       `verlet_simulation`：action.tool=submit_job、action.program=python3、
       action.evidence_refs 逐字包含第 2 步返回的 evidence_ref、effects 至少包含
       workspace_write/process_tree/external_job/scientific_execution、
       workdir_role=run_root、expected_outputs=["verlet_result.json"]。payload 必须
       直接使用 python3 运行只读 verlet.py，不能包装成 shell script 或改写源码；
       dry_run 只用于预览，真提交必须传 route_step_id=verlet_simulation，
       且不允许拆成第二个 external-job step。
    4. 按 prereg 参数 dt=0.01、nsteps=100000 提交：
       submit_job(dry_run=true, scheduler="local", stage="simulation",
                  workdir=<注入的 run_root>,
                  command='python3 <verlet.py 的绝对路径> 0.01 100000 <run_root>/verlet_result.json')
       （verlet.py 的绝对路径先用 list_files 在 nodes/experiment/fixtures/verlet_e2e_src/ 下定位）
       检查 script_preview 里能看到真正的 payload 命令，再 dry_run=false 真提交。
    5. wait_for_external_job 到终态，读 verlet_result.json 与 stdout。
    6. 把 max_rel_energy_drift 解析成 clean_results，并记录与 prereg threshold 的
       数值比较；这是 secondary integration E2E 的 execution check，不得包装成假说 verdict。
    7. 走完整 secondary scientific closure：生成并冻结 raw_results、clean_results，
       写唯一 experiment_log（明确 status、returncode、日志路径与 Credibility，不写
       scientific verdict/sediment）→ preview_experiment_contract → freeze_artifact →
       create_experiment 登记当前 execution record → finalize_external_job →
       再次 preview_experiment_contract。不得调用 primary-only 的
       resolve_prereg_questions / resolve_prereg_hypotheses / sediment gate。

upstream_artifacts:
  - type: claim
    name: H_verlet_energy_drift_bounded
    metadata: {claim_type: hypothesis, status: open, created_at: "2026-08-18T00:00:00+00:00"}
    content: |
      velocity-Verlet 作为辛积分器，在 dt=0.01、10^5 步的 1D 谐振子上，
      相对能量漂移最大值有界且小于 1e-3。
  - type: pre_registration
    name: Verlet_Energy_Drift_dt001
    metadata:
      frozen: true
      frozen_at: "2026-08-18T00:00:00+00:00"
      freeze_reason: "E2E: scheduler 路径上的 scientific closure 验证"
      run_role: secondary
      analysis_eligible: false
      stage: simulation
      requires_scheduler: true
    content: |
      ## Pre-Registration: velocity-Verlet 能量漂移有界性

      ### Hypothesis (H1)
      velocity-Verlet 积分 1D 谐振子（m=k=1, x0=1.0, v0=0.0, E0=0.5）时，
      能量误差有界振荡而非单调累积；dt=0.01、nsteps=100000 下相对能量漂移
      最大值 max_rel_energy_drift < 1e-3。

      ### Setup
      - 积分器: 本 harness-framework 仓库 nodes/experiment/fixtures/verlet_e2e_src/verlet.py（只读）
      - 参数: dt=0.01, nsteps=100000
      - 执行: submit_job, scheduler=local, stage=simulation
      - 输出: <run_root>/verlet_result.json，含 max_rel_energy_drift

      ### Falsification criteria
      - metric: max_rel_energy_drift
      - op: <
      - threshold: 1e-3
      - 若 max_rel_energy_drift >= 1e-3 或作业 returncode != 0 → 假说被否证

      ### Expected output
      - verlet_result.json 可解析，含 e0/e_min/e_max/max_rel_energy_drift
      - stdout 含 VERLET_OK 标记
