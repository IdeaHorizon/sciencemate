      （原先回吐的是陈旧缓存），并以 lock_reason=corrected_but_still_missing 与
      「尚未做过纠正」那一处区分开。诚实标注：该分支目前构造不到 ——
      _validated_expected_outputs_correction 只认纯删减的纠正，而纯删减不可能
      留下缺失产物；保留它是因为它防的自相矛盾事件确有其事。

