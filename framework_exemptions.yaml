    argv_source: model_paths
    owner: cuib
    reason: "gmsh / openfoam checkMesh 在宿主上跑，case 目录与几何文件来自工具参数；这是现存最大的一片宿主执行面，PR B 起原生后端可用后应改走 spawn_and_wait"
  - file: nodes/data/tools/preprocessing_capabilities.py
    sites: [_validate_generated_artifact_format]
    argv_source: model_paths
    owner: cuib
    reason: "bash -n 语法检查模型生成的脚本（只解析不执行）"

  # ── nodes/experiment（owner lujy）──
  - file: nodes/experiment/tools/build_graph.py
    sites: [_run]
    argv_source: framework
    reason: "argv 是 prepare_launch 兼容垫片交回的原生后端命令（已在墙内），但自己 subprocess.run 绕开了咽喉"
