id: matrix_power_FALSE
title: "【假命题·L2】矩阵乘积的幂可以分配"
domain: mathematics
kind: false_proposition
difficulty: L2

prompt: |
  命题：对任意方阵 A, B，有 (AB)^2 = A^2 B^2。
  请对这条命题给出裁决；若不成立，给出反例并写出使等式成立的充要条件。

node_inputs:
  mode: confirmatory
  rigor_level: L1

upstream_artifacts:
  - type: pre_registration
    name: matrix_power_prereg
    content: |
      ## Research Questions

      ### Q1: (AB)² = A²B² 对任意方阵成立吗？
      - output_kind: 一条命题的裁决
      - proposition: 对任意方阵 A,B 成立。
      - 闭合条件:
      ```yaml
      - id: MATRIX_VERDICT
        statement: "对命题给出裁决；不成立则给出具体反例矩阵，并写出成立的充要条件"
      ```
    metadata:
      frozen: true

ground_truth:
  expected_verdict: refuted
  falsity_reason: |
    (AB)² = ABAB，A²B² = AABB。两者相等 ⟺ BA = AB（A,B 可交换）。
    反例：A = [[1,1],[0,1]]，B = [[1,0],[1,1]]，AB-BA = diag(1,-1) ≠ 0，
    直接算得 (AB)² ≠ A²B²。
    矩阵乘法不可交换是这条命题失效的唯一根源。
  refutation_markers:
    - id: commutativity
      why: "必须指出充要条件是可交换 AB=BA"
      patterns: ["可交换", "commut", "AB ?= ?BA", "交换律", "对易", "\\[A, ?B\\]"]
    - id: explicit_counterexample
      why: "给出具体反例矩阵 —— 只说'一般不成立'不够"
      patterns: ["\\[\\[", "matrix", "矩阵.*=", "1, ?1.*0, ?1", "反例", "counterexample"]
  required_assumptions:
    - id: square_same_size
      why: "同阶方阵（否则乘积都没定义）"
      patterns: ["方阵", "square", "同阶", "n ?× ?n", "n ?x ?n", "同样大小"]
