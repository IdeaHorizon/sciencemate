# 模型角色目录 —— 平台与 harness **共读的唯一一份**
#
# ## 什么是角色
#
# 一个角色 = 一个**能力槽**：框架或某个节点需要"一个能干某件事的模型"来填。
# 角色由**消费方**定义（谁需要它谁定义），所以目录跟着 harness 走，不跟着
# 平台走 —— 平台按 HARNESS_ROOT 读这个文件，不另存一份。
#
# 在此之前这件事有九份抄件（DB 表 / 两份 provider 词表 / 两份 env 名单 /
# LLM_PROVIDERS_JSON / 节点里的 backend.yaml / 同一份默认值的 dataclass…），
# 其中两份名单的分歧直接造成一个凭据泄漏面：审图 key 被白名单透进 worker，
# 而擦除名单不认识它，于是它留在 os.environ 里被模型可控的 execute_python
# 够得着。一个问题有几份抄件，就有几个会各自演化的答案。
#
# ## 加一个角色要改什么
#
# 只改这个文件 + 消费方按 id 去 require()。平台 UI、探针、开局注入、凭据
# 擦除**全部按目录扫**，不写死名单 —— 新角色不会因为"某张名单忘了加"而
# 静默漏过。
#
# ## 字段
#
#   id            调用时用的名字（消费方 require(id)）
#   title         给人看的名字（设置页）
#   description   这个槽是干什么的
#   modality      text | vision。决定平台探活时打什么样的请求：vision 角色
#                 会带一张 1×1 图去探，因为"这个模型认不认图"是能观测的，
#                 不该靠模型名去猜。
#   required      平台层面缺了它就没法开工（reasoning 是唯一一个）
#   absence_note  缺这个角色的**后果与出路**，一字不改地注入给消费方节点。
#                 写清楚"降级成什么"比写"不可用"有用得多。
#   absence_impact 同一件事**说给人听**：设置页上那句"这个槽空着，我会少什么"。
#                 与 absence_note 分开写，是因为两句话的读者是相反的两个人 ——
#                 absence_note 对**被拒绝的节点**说"你什么都不用做，也别为这件事
#                 重跑"，而设置页的读者恰恰是唯一能把这个槽填上的那个人。一份
#                 文案同时服务两个相反的读者，必然对其中一个撒谎 —— 实测：
#                 研究员在一个「注册模型」按钮旁边读到"这不是你能改的事"。
#   title_en / description_en / absence_impact_en
#                 设置页上那三句的英文。它们是**说给人听**的，跟着界面语言走；
#                 absence_note 是注入给节点的，不在此列。缺了英文，英文界面的
#                 设置页上就是一段中文（2026-10-19）—— 有条测试逐个角色核对。

schema_version: 1

roles:
  - id: reasoning
    title: 主推理模型
    title_en: Main reasoning model
    description: >-
      助手在会话中使用的主模型。会话里选择的模型就是它。
    description_en: >-
      The main model the assistant uses in sessions. The model you pick in a
      session is this one.
    modality: text
    required: true
    absence_note: 没有主推理模型，任何 run 都无法开始。
    absence_impact: 未设置时，会话无法开始。
    absence_impact_en: Without it, sessions cannot start.

  - id: visual_review
    title: 图像审查模型（VLM）
    title_en: Image review model (VLM)
    description: >-
      检查生成的图表上有没有看得出的问题，指出问题在哪里；图表是否通过由固定的规则判断。
    description_en: >-
      Checks generated figures for visible problems and points out where they
      are; whether a figure passes is decided by fixed rules.
    modality: vision
    required: false
    absence_note: >-
      无此角色时**审图工具不在你的工具面上**（不是调了会失败，是根本没有），
      finalize 自动按 draft 交付：机械校验照做，产物记 visual_review_capability
      =absent、不携带任何"已审图"断言。你什么都不用做，也不要为这件事重跑 ——
      平台配没配审图模型不是你能改的事。
    absence_impact: >-
      未设置时不检查图表，成果按草稿交付，也不会标注为「图表已检查」。
    absence_impact_en: >-
      Without it, figures are not checked; outputs are delivered as drafts and
      are not marked as checked.

  - id: feed_curation
    title: 资讯挖掘模型
    title_en: Feed curation model
    description: >-
      科研资讯根据你的项目推断关注的学科和检索词、查找相关研究，并把一周的内容整理成简报时用的模型。
      只用于科研资讯，出错不影响研究。
    description_en: >-
      Used by the research feed to infer fields and search terms from your
      projects, find related research, and condense a week of items into a
      brief. It is only used for the feed; a failure never affects your
      research.
    modality: text
    required: false
    absence_note: >-
      无此角色时**自动挖掘这项能力根本不在**（不是开了会失败，是开关本身
      显示为不可用）。资讯流照常工作：全局采集、按你手选的方向和你课题的
      术语排序、周报按需生成 —— 少的只是"平台替你推断方向、替你定向检索"
      这一层。你不用为这件事做任何事。
    absence_impact: >-
      未设置时，科研资讯不会根据项目推断学科、也不做定向检索；按你订阅的学科推荐和周报照常。
    absence_impact_en: >-
      Without it, the feed does not infer fields from your projects or run
      targeted searches; recommendations for the fields you follow and weekly
      briefs keep working.
